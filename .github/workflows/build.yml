name: Build MIDI Harmonic HUD VST3

# ============================================================================
# TRIGGERS
# ============================================================================
on:
  # 1) Compilación automática al hacer push a main o master
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

  # 2) Compilación automática en Pull Requests hacia main o master
  pull_request:
    branches: [ main, master ]

  # 3) Compilación MANUAL desde la pestaña "Actions" → "Run workflow"
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      create_release_artifact:
        description: '¿Empaquetar VST3 como artefacto descargable?'
        required: true
        default: true
        type: boolean

# ============================================================================
# PERMISOS
# ============================================================================
permissions:
  contents: read

# ============================================================================
# JOBS
# ============================================================================
jobs:
  build-macos:
    name: Build VST3 (macOS Universal)
    runs-on: macos-latest

    # Variables de entorno compartidas
    env:
      # Tipo de build: usa el input manual si existe, si no, Release
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}
      # Ruta esperada del bundle VST3
      VST3_NAME: "MIDI Harmonic HUD.vst3"
      VST3_DIR: "build/MidiHarmonicHUD_artefacts/${{ github.event.inputs.build_type || 'Release' }}/VST3"

    steps:
      # ---------------------------------------------------------------
      - name: 📥 Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------------------------------------------------------------
      - name: 🛠️ Instalar Ninja
        run: brew install ninja

      # ---------------------------------------------------------------
      - name: 🔍 Verificar toolchain
        run: |
          echo "=== Xcode / CLT version ==="
          xcode-select -p
          clang --version
          echo ""
          echo "=== CMake / Ninja ==="
          cmake --version
          ninja --version
          echo ""
          echo "=== Arquitecturas destino ==="
          echo "x86_64;arm64 (Universal Binary)"
          echo "Deployment target: macOS 10.13"

      # ---------------------------------------------------------------
      - name: ⚙️ Configurar CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.13"

      # ---------------------------------------------------------------
      - name: 🔨 Compilar VST3
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      # ---------------------------------------------------------------
      - name: ✅ Verificar el bundle VST3
        run: |
          VST3_PATH="${{ env.VST3_DIR }}/${{ env.VST3_NAME }}"

          if [ ! -d "$VST3_PATH" ]; then
            echo "❌ ERROR: No se encontró el bundle VST3 en $VST3_PATH"
            echo "Buscando cualquier .vst3 en el directorio build..."
            find build -name "*.vst3" -type d
            exit 1
          fi

          echo "✅ Bundle VST3 encontrado: $VST3_PATH"
          echo ""
          echo "=== Arquitecturas del binario ==="
          file "$VST3_PATH/Contents/MacOS/MIDI Harmonic HUD"
          echo ""
          echo "=== Contenido del bundle ==="
          find "$VST3_PATH" -type f

      # ---------------------------------------------------------------
      - name: 📦 Empaquetar VST3 como ZIP
        if: ${{ github.event.inputs.create_release_artifact != 'false' }}
        run: |
          cd "${{ env.VST3_DIR }}"
          zip -r -y "MidiHarmonicHUD-VST3.zip" "${{ env.VST3_NAME }}"
          echo ""
          echo "=== Contenido del ZIP ==="
          unzip -l "MidiHarmonicHUD-VST3.zip"

      # ---------------------------------------------------------------
      - name: ⬆️ Subir artefacto
        if: ${{ github.event.inputs.create_release_artifact != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: MidiHarmonicHUD-VST3-${{ env.BUILD_TYPE }}-${{ github.sha }}
          path: ${{ env.VST3_DIR }}/MidiHarmonicHUD-VST3.zip
          retention-days: 30
          if-no-files-found: error

      # ---------------------------------------------------------------
      - name: 📋 Resumen del build
        if: always()
        run: |
          echo "## 🎹 Build Summary - MIDI Harmonic HUD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parámetro | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build type | ${{ env.BUILD_TYPE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Arquitecturas | x86_64;arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment target | macOS 10.13 |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
