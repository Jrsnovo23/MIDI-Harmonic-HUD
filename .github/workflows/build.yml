name: Build MIDI Harmonic HUD VST3

# ============================================================================
# TRIGGERS
# ============================================================================
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

  pull_request:
    branches: [ main, master ]

  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      create_release_artifact:
        description: '¿Empaquetar VST3 como artefacto descargable?'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# ============================================================================
# JOBS
# ============================================================================
jobs:
  build-macos:
    name: Build VST3 (Intel x86_64 · macOS 10.13 target)
    runs-on: macos-15-intel

    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}
      # Nombre "bonito" que queremos en el ZIP final (con espacios, como lo ve Ableton)
      VST3_FRIENDLY_NAME: "MIDI Harmonic HUD.vst3"
      # Directorio base donde CMake coloca los artefactos
      VST3_DIR: "build/MidiHarmonicHUD_artefacts/${{ github.event.inputs.build_type || 'Release' }}/VST3"

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🛠️ Instalar Ninja
        run: brew install ninja

      - name: 🔍 Verificar toolchain y arquitectura del runner
        run: |
          echo "=== Runner info ==="
          uname -a
          sw_vers
          echo ""
          echo "=== Arquitectura del runner (debe ser x86_64) ==="
          arch
          echo ""
          echo "=== Xcode / CLT ==="
          xcode-select -p
          clang --version
          echo ""
          echo "=== CMake / Ninja ==="
          cmake --version
          ninja --version
          echo ""
          echo "=== Target de compilación ==="
          echo "  Arquitectura:   x86_64 (Intel only)"
          echo "  Deployment:     macOS 10.13 (High Sierra)"
          echo "  Render backend: CoreGraphics (Metal DESACTIVADO)"

      - name: ⚙️ Configurar CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.13"

      - name: 🔨 Compilar VST3
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: 🔎 Detectar el bundle VST3 generado
        id: detect_vst3
        run: |
          echo "=== Buscando bundles .vst3 en el directorio de artefactos ==="
          find build/MidiHarmonicHUD_artefacts -name "*.vst3" -type d -print

          echo ""
          echo "=== Detección dinámica del bundle ==="
          # Buscar el primer .vst3 dentro del directorio de artefactos
          VST3_PATH=$(find build/MidiHarmonicHUD_artefacts -name "*.vst3" -type d -print -quit)

          if [ -z "$VST3_PATH" ]; then
            echo "❌ ERROR: No se encontró ningún bundle .vst3 en build/MidiHarmonicHUD_artefacts"
            echo "Estructura del directorio de artefactos:"
            find build/MidiHarmonicHUD_artefacts -type d
            exit 1
          fi

          echo "✅ Bundle detectado: $VST3_PATH"
          echo "vst3_path=$VST3_PATH" >> $GITHUB_OUTPUT

      - name: ✅ Verificar el bundle VST3
        run: |
          VST3_PATH="${{ steps.detect_vst3.outputs.vst3_path }}"
          VST3_BINARY="$VST3_PATH/Contents/MacOS/$(basename "$VST3_PATH" .vst3)"

          echo "=== Arquitecturas del binario (debe ser solo x86_64) ==="
          file "$VST3_BINARY"
          echo ""

          echo "=== Verificación de arquitecturas con lipo ==="
          lipo -info "$VST3_BINARY"
          echo ""

          echo "=== Verificar que NO contiene arm64 ==="
          if lipo -info "$VST3_BINARY" | grep -q "arm64"; then
            echo "❌ ERROR: El binario contiene arm64, debería ser solo x86_64"
            exit 1
          fi
          echo "✅ Confirmado: binario solo x86_64"

          echo ""
          echo "=== Deployment target mínimo (debe ser 10.13) ==="
          otool -l "$VST3_BINARY" \
            | grep -A4 LC_VERSION_MIN_MACOSX | head -6 || true
          echo ""

          echo "=== Símbolos de libc++ (verificar que no haya referencias modernas) ==="
          nm -u "$VST3_BINARY" \
            | grep -i "c++" | head -20 || echo "(sin símbolos libc++ problemáticos)"

          echo ""
          echo "=== Contenido del bundle ==="
          find "$VST3_PATH" -type f

      - name: 📦 Empaquetar VST3 como ZIP (con nombre amigable)
        if: ${{ github.event.inputs.create_release_artifact != 'false' }}
        run: |
          VST3_PATH="${{ steps.detect_vst3.outputs.vst3_path }}"
          VST3_BASENAME=$(basename "$VST3_PATH")

          echo "=== Renombrando bundle para el ZIP ==="
          echo "Nombre original: $VST3_BASENAME"
          echo "Nombre en el ZIP: $VST3_FRIENDLY_NAME"

          # Crear carpeta temporal de empaquetado
          mkdir -p /tmp/package
          cp -R "$VST3_PATH" "/tmp/package/$VST3_FRIENDLY_NAME"

          # Crear el ZIP desde la carpeta temporal
          cd /tmp/package
          zip -r -y "MidiHarmonicHUD-VST3-x86_64.zip" "$VST3_FRIENDLY_NAME"

          # Mover el ZIP a un lugar accesible
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          mv "MidiHarmonicHUD-VST3-x86_64.zip" "$GITHUB_WORKSPACE/artifacts/"

          echo ""
          echo "=== Contenido del ZIP ==="
          unzip -l "$GITHUB_WORKSPACE/artifacts/MidiHarmonicHUD-VST3-x86_64.zip"

      - name: ⬆️ Subir artefacto
        if: ${{ github.event.inputs.create_release_artifact != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: MidiHarmonicHUD-VST3-${{ env.BUILD_TYPE }}-x86_64-${{ github.sha }}
          path: artifacts/MidiHarmonicHUD-VST3-x86_64.zip
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Resumen del build
        if: always()
        run: |
          echo "## 🎹 Build Summary - MIDI Harmonic HUD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parámetro | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Runner | macOS 15 Intel (x86_64) |" >> $GITHUB_STEP_SUMMARY
          echo "| Build type | ${{ env.BUILD_TYPE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Arquitectura | **x86_64 (Intel only)** |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment target | **macOS 10.13 (High Sierra)** |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend gráfico | **CoreGraphics (sin Metal)** |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
